{% set name = "jupyter-themer" %}
{% set version = "0.4.0" %}
{% set compress_type = "tar.gz" %}
{% set hash = "67de747b431c869e780453adf08d396cf911e94e37dbf36ce7ff0d6d9e7f09d3" %}
{% set build = 2 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ compress_type }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ compress_type }}
  sha256: {{ hash }}

build:
  noarch: python
  entry_points:
    - jupyter-themer = jupythemer.jupythemer:run
  number: {{ build }}
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - jupyter
    - notebook

test:
  requires:
    - python {{ python_min }}
  imports:
    - jupythemer

  commands:
    - jupyter-themer --help

about:
  home: https://github.com/transcranial/jupyter-themer
  # No MANIFEST - see https://github.com/transcranial/jupyter-themer/pull/25
  license_file:  {{ RECIPE_DIR }}/LICENSE
  license: MIT
  license_family: MIT
  summary: 'Custom CSS themer for jupyter notebooks'
  dev_url: https://github.com/transcranial/jupyter-themer

extra:
  recipe-maintainers:
    - pmlandwehr
